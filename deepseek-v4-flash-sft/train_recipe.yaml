recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1234

step_scheduler:
  global_batch_size: $GLOBAL_BATCH_SIZE
  local_batch_size: $LOCAL_BATCH_SIZE
  ckpt_every_steps: $MAX_STEPS
  save_checkpoint_every_epoch: false
  val_every_steps: 100000
  gc_every_steps: 1
  num_epochs: 1
  max_steps: $MAX_STEPS

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: $CP_SIZE
  pp_size: $PP_SIZE
  ep_size: $EP_SIZE
  sequence_parallel: false
  activation_checkpointing: true
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    layers_per_stage: 11
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
  moe:
    ignore_router_for_ac: true
    reshard_after_forward: false
    wrap_outer_model: false

dist_env:
  backend: $DIST_BACKEND
  timeout_minutes: 60

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config.from_pretrained
    pretrained_model_name_or_path: $HF_MODEL
    name_or_path: $HF_MODEL
    num_nextn_predict_layers: 0
  trust_remote_code: false
  load_base_model: true
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    dispatcher: uccl_ep
    experts: torch_mm
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
  - "*.self_attn.wq_a"
  - "*.self_attn.wq_b"
  - "*.self_attn.wkv"
  dim: $LORA_RANK
  alpha: $LORA_ALPHA
  dropout: 0.0
  use_memory_efficient_lora: true
  use_triton: false

checkpoint:
  enabled: true
  checkpoint_dir: $CHECKPOINT_DIR
  model_save_format: safetensors
  save_consolidated: final
  save_optimizer: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: $DATASET_PATH
  split: train
  shuffle_seed: 42
  truncation: true
  seq_length: $SEQ_LENGTH
  padding: max_length
  chat_template: |-
    {% for message in messages %}{% if message['role'] == 'user' %}User:
    {{ message['content'] }}
    {% elif message['role'] == 'assistant' %}Assistant:
    {% generation %}{{ message['content'] }}{% endgeneration %}
    {% endif %}{% endfor %}
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: $HF_MODEL

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 8
  shuffle: true

optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.95
  eps: 1e-8
  lr: 1e-5
  weight_decay: 0.1
